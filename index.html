<!DOCTYPE html>
<html lang="th">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Final Assignment - 3D Portfolio</title>

    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #e0e0e0;
        }
    </style>

    <!-- Three.js -->
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>

    <!-- GLTF Loader -->
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>

    <!-- Draco Loader -->
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/DRACOLoader.js"></script>

    <!-- Orbit Controls -->
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

</head>

<body>

<script>

    //  RENDERER
    
    const renderer = new THREE.WebGLRenderer({
        antialias: true
    });

    renderer.setSize(
        window.innerWidth,
        window.innerHeight
    );

    renderer.setPixelRatio(
        Math.min(window.devicePixelRatio, 2)
    );

    renderer.outputEncoding =
        THREE.sRGBEncoding;

    renderer.shadowMap.enabled = true;

    document.body.appendChild(
        renderer.domElement
    );


    
    //  ฉาก 

    const scene = new THREE.Scene();

    scene.background =
        new THREE.Color(0xe0e0e0);


    
    //  มุมกล้อง
    

    const camera =
        new THREE.PerspectiveCamera(
            45,
            window.innerWidth /
            window.innerHeight,
            0.1,
            1000
        );

    camera.position.set(
        0,
        30,
        144
    );


    const controls =
        new THREE.OrbitControls(
            camera,
            renderer.domElement
        );

    controls.enableDamping = true;

    controls.target.set(
        0,
        5,
        0
    );


   
    //  แสง
    
    const ambientLight =
        new THREE.AmbientLight(
            0xffffff,
            0.2
        );

    scene.add(
        ambientLight
    );

    const directionalLight =
        new THREE.DirectionalLight(
            0xffffff,
            2.0
        );

    directionalLight.position.set(
        20,
        40,
        20
    );

    directionalLight.castShadow = true;

    directionalLight.shadow.mapSize.width =
        2048;

    directionalLight.shadow.mapSize.height =
        2048;

    scene.add(
        directionalLight
    );

    const pointLight =
        new THREE.PointLight(
            0xffffff,
            4,
            30
        );

    pointLight.position.set(
        0,
        10,
        5
    );

    scene.add(
        pointLight
    );


   
    // Door picking animation
   

    let mixer;

    let doorAction;

    const clock =
        new THREE.Clock();


    
    // DRACO LOADER
    

    const dracoLoader =
        new THREE.DRACOLoader();

    dracoLoader.setDecoderPath(
        'https://www.gstatic.com/draco/versioned/decoders/1.5.6/'
    );


   
    //  GLTF LOADER
   

    const gltfLoader =
        new THREE.GLTFLoader();

    gltfLoader.setDRACOLoader(
        dracoLoader
    );

    const modelUrl =
        'https://raw.githubusercontent.com/kittapol888/Final_Assignment/main/firstTry.glb';


   
    // CEL SHADING 
  
    let celBall;

    const celBallStart =
        new THREE.Vector3(
            0,      // X
            55,     // Y
            -7       // Z
        );

    const celUniforms = {

        uTime: {
            value: 0.0
        },
        uLightDirection: {
            value:
                new THREE.Vector3(
                    0.4,
                    1.0,
                    1.0
                ).normalize()
        },
        uDragPosition: {
            value:
                new THREE.Vector3(
                    0,
                    0,
                    0
                )
        },

        // 0 = ไม่ลาก
        // 1 = ลาก
        uDragging: {
            value: 0.0
        }

    };


   
    //  VERTEX SHADER
    

    const celVertexShader = `

        uniform float uTime;

        uniform vec3 uDragPosition;

        uniform float uDragging;


        varying vec3 vNormal;

        varying vec3 vPosW;


        void main() {

            
            vec3 pos = position;

            float floating =
                sin(uTime * 3.0) * 3.0;

            pos.y += floating;

            pos +=
                uDragPosition *
                uDragging;

            vNormal =
                normalize(
                    normalMatrix * normal
                );

            vec4 worldPosition =
                modelMatrix *
                vec4(pos, 1.0);

            vPosW =
                worldPosition.xyz;

            gl_Position =
                projectionMatrix *
                modelViewMatrix *
                vec4(pos, 1.0);

        }

    `;


    
    // FRAGMENT SHADER
   

    const celFragmentShader = `

        precision mediump float;


        uniform vec3 uLightDirection;


        varying vec3 vNormal;

        varying vec3 vPosW;


        void main() {

            vec3 N =
                normalize(vNormal);

            vec3 L =
                normalize(
                    uLightDirection
                );

            float diffuse =
                max(
                    dot(N, L),
                    0.0
                );


            // CEL SHADING แบ่งแสงออก
        
            float level = 4.0;

            diffuse =
                floor(
                    diffuse * level
                ) / level;

            float ambient = 0.25;

            vec3 baseColor =
                vec3(
                    0.2,
                    0.6,
                    1.0
                );

            vec3 color =
                baseColor *
                (diffuse + ambient);


            gl_FragColor =
                vec4(
                    color,
                    1.0
                );

        }

    `;

    const celGeometry =
        new THREE.SphereBufferGeometry(
            8.0,
            32,
            32
        );


    const celMaterial =
        new THREE.ShaderMaterial({

            vertexShader:
                celVertexShader,

            fragmentShader:
                celFragmentShader,

            uniforms:
                celUniforms

        });


    celBall =
        new THREE.Mesh(
            celGeometry,
            celMaterial
        );


    celBall.position.copy(
        celBallStart
    );


    celBall.castShadow = true;

    celBall.receiveShadow = true;


    scene.add(
        celBall
    );

    gltfLoader.load(

        modelUrl,

        (gltf) => {

            const model =
                gltf.scene;

            model.traverse(
                (child) => {

                    if (child.isMesh) {

                        
                        child.castShadow = true;

                        child.receiveShadow = true;


                      
                        if (child.material) {

                            child.material.encoding =
                                THREE.sRGBEncoding;

                        }


                        const name =
                            child.name.toLowerCase();


                        
                        // GitHub
                      

                        if (
                            name.includes('github') ||
                            name.includes('logo')
                        ) {

                            child.userData = {

                                type:
                                    'github_link'

                            };

                        }


                     
                        // Door
                    

                        else if (

                            name.includes('door') ||
                            name.includes('push') ||
                            name.includes('button')

                        ) {

                            child.userData = {

                                type:
                                    'door_control'

                            };

                        }

                    }

                }
            );

            const box =
                new THREE.Box3()
                    .setFromObject(
                        model
                    );


            const center =
                box.getCenter(
                    new THREE.Vector3()
                );


            model.position.x -=
                center.x;


            model.position.z -=
                center.z;


            model.position.y -=
                box.min.y;


            scene.add(
                model
            );

            // Animation

            if (
                gltf.animations &&
                gltf.animations.length > 0
            ) {

                mixer =
                    new THREE.AnimationMixer(
                        model
                    );


                doorAction =
                    mixer.clipAction(
                        gltf.animations[0]
                    );


                doorAction.setLoop(
                    THREE.LoopOnce
                );


                doorAction.clampWhenFinished =
                    true;

            }

        },

        undefined,

        (error) => {

            console.error(
                'โหลดโมเดลไม่สำเร็จ:',
                error
            );

        }

    );

    //  RAYCASTER

    const raycaster =
        new THREE.Raycaster();

    const mouse =
        new THREE.Vector2();

    // สถานะ 1 / 0 ลากบอล

    let isDraggingCelBall =
        false;
   
    const dragPlane =
        new THREE.Plane();


    const dragPoint =
        new THREE.Vector3();


    
    // UPDATE MOUSE POSITION
   
    function updateMouse(event) {

        mouse.x =
            (event.clientX /
                window.innerWidth) * 2 - 1;


        mouse.y =
            -(event.clientY /
                window.innerHeight) * 2 + 1;

    }

    // POINTER DOWN

    window.addEventListener(
        'pointerdown',
        (event) => {

            updateMouse(event);

            // ยิง Ray จาก Camera
            raycaster.setFromCamera(
                mouse,
                camera
            );

            // ตรวจลูกบอลโดยตรง
            const ballIntersects =
                raycaster.intersectObject(
                    celBall
                );

            // ถ้าคลิกบอล

            if (
                ballIntersects.length > 0
            ) {

                isDraggingCelBall =
                    true;


                celUniforms
                    .uDragging
                    .value = 1.0;


                // หยุด OrbitControls
                // ให้เมาส์ใช้ลากบอล
                controls.enabled =
                    false;


               
                // สร้าง Plane บริเวณสำหรับลาก
              
                const cameraDirection =
                    new THREE.Vector3();

                camera.getWorldDirection(
                    cameraDirection
                );


                dragPlane.setFromNormalAndCoplanarPoint(
                    cameraDirection,
                    celBallStart
                );

            }

        }
    );

    //  POINTER MOVE
    
    window.addEventListener(
        'pointermove',
        (event) => {

            if (
                !isDraggingCelBall
            ) {

                return;

            }


            updateMouse(event);


            raycaster.setFromCamera(
                mouse,
                camera
            );

            // หาจุดที่ Ray ชน Plane
        
            const hit =
                raycaster.ray.intersectPlane(
                    dragPlane,
                    dragPoint
                );


            if (!hit) {

                return;

            }

           
            // คำนวณ Offset จากจุดเริ่ม

            const offset =
                dragPoint.clone()
                    .sub(celBallStart);

            // จำกัดระยะการลาก

            offset.x =
                THREE.MathUtils.clamp(
                    offset.x,
                    -30,
                    30
                );


            offset.y =
                THREE.MathUtils.clamp(
                    offset.y,
                    -20,
                    20
                );


            offset.z =
                THREE.MathUtils.clamp(
                    offset.z,
                    -30,
                    30
                );
  
            // ส่ง Offset เข้า Vertex Shader

            celUniforms
                .uDragPosition
                .value.copy(
                    offset
                );

        }
    );


    
    // POINTER UP


    window.addEventListener(
        'pointerup',
        () => {

            if (
                isDraggingCelBall
            ) {

                // หยุดลาก
                isDraggingCelBall =
                    false;


                // ปิดสถานะ Drag ใน Shader
                celUniforms
                    .uDragging
                    .value = 0.0;

                // กลับตำแหน่งเดิม
        
                celUniforms
                    .uDragPosition
                    .value.set(
                        0,
                        0,
                        0
                    );


                // เปิด OrbitControls กลับ
                controls.enabled =
                    true;

            }

        }
    );

    // CLICK

    window.addEventListener(
        'click',
        (event) => {

            // ถ้าเพิ่งลากลูกบอล
            // ไม่ต้องทำ Click action อื่น
            if (
                isDraggingCelBall
            ) {

                return;

            }


            updateMouse(event);


            raycaster.setFromCamera(
                mouse,
                camera
            );


            const intersects =
                raycaster.intersectObjects(
                    scene.children,
                    true
                );


            if (
                intersects.length === 0
            ) {

                return;

            }


            const clickedObject =
                intersects[0].object;

            // GitHub Picking
           
            if (
                clickedObject.userData &&
                clickedObject.userData.type ===
                'github_link'
            ) {

                window.open(
                    'https://kittapol888.github.io/',
                    '_blank'
                );

            }

            // Door Picking

            else if (
                clickedObject.userData &&
                clickedObject.userData.type ===
                'door_control'
            ) {

                if (doorAction) {

                    doorAction.reset();

                    doorAction.play();

                }

            }

        }
    );


    
    //ANIMATION LOOP
  

    function animate() {

        requestAnimationFrame(
            animate
        );


        // Delta Time
        const delta =
            clock.getDelta();
    
        celUniforms
            .uTime
            .value += delta;


       

        if (mixer) {

            mixer.update(
                delta
            );

        }

        controls.update();
        renderer.render(
            scene,
            camera
        );

    }


    animate();


   
    // WINDOW RESIZE
    

    window.addEventListener(
        'resize',
        () => {

            camera.aspect =
                window.innerWidth /
                window.innerHeight;


            camera.updateProjectionMatrix();


            renderer.setSize(
                window.innerWidth,
                window.innerHeight
            );


            renderer.setPixelRatio(
                Math.min(
                    window.devicePixelRatio,
                    2
                )
            );

        }
    );

</script>

</body>

</html>
